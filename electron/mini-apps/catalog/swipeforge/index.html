<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwipeForge</title>
<style>
:root{color-scheme:light dark;font:13px/1.4 Inter,system-ui,sans-serif;--bg:#f8f7fc;--card:#fff;--ink:#292635;--muted:#77728a;--line:#e6e3ef;--field:#f3f1f9;--accent:#2e7053;--accent-ink:#fff;--soft:#e7f3ec;--warn:#9a5b00;--danger:#b4233a;--ok:#2e7053}
@media (prefers-color-scheme:dark){:root{--bg:#121320;--card:#1b1d2e;--ink:#eeeff9;--muted:#a3a5bc;--line:#303249;--field:#25273a;--accent:#82cfa8;--accent-ink:#0d2419;--soft:#1f3a2e;--warn:#f0b85a;--danger:#ff8f9f;--ok:#82cfa8}}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{background:var(--bg);color:var(--ink);overflow:hidden}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit;min-width:0}
button{cursor:pointer;border:0;border-radius:8px;padding:7px 11px;background:var(--field)}
button:hover:enabled{filter:brightness(.96)}button:disabled{opacity:.45;cursor:default}
:is(button,select,input,textarea,a):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--field)}
textarea{resize:vertical;min-height:64px}
label{display:grid;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}.danger{color:var(--danger)}
.row{display:flex;align-items:center;gap:8px;min-width:0}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:11px}.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark{flex:none;width:28px;height:28px}.icon{width:16px;height:16px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.segmented{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--field);border:1px solid var(--line)}
.segmented button{flex:1;background:transparent;padding:5px 8px;border-radius:7px}.segmented button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 2px #0002;font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:600;background:var(--field);white-space:nowrap}
.chip[data-status=success],.chip[data-status=published]{background:var(--soft);color:var(--ok)}
.chip[data-status=failed],.chip[data-status=cancelled]{color:var(--danger)}
.chip[data-status=pending],.chip[data-status=in_progress],.chip[data-status=scheduled]{color:var(--warn)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(1turn)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
#error{margin:0;color:var(--danger);font-size:12px;overflow-wrap:anywhere}#error:empty{display:none}
.notice{margin:0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}.notice:empty{display:none}
/* Full app */
main{height:100%;overflow:auto;padding:18px;display:grid;gap:14px;align-content:start;max-width:1180px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header.top h1{font-size:18px;margin:0}
.layout{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
form#create{display:grid;gap:10px}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.thumb{width:56px;height:56px;border-radius:9px;background:var(--field);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb svg{width:22px;height:22px}
.item .actions{display:flex;gap:4px}.item .actions button{padding:6px 8px}
.tabs{display:flex;gap:4px}.tabs button[aria-selected=true]{background:var(--card);border:1px solid var(--line);font-weight:600}
.pager{display:flex;justify-content:space-between;align-items:center}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
#connect-card{display:grid;gap:10px;max-width:560px}
#connect-card ol{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:3px}
#panel{display:grid;gap:10px}
/* Popover */
body[data-view=popover]{background:var(--card);overflow-x:hidden;overflow-y:auto}
body[data-view=popover] main{height:auto;padding:10px;gap:8px;overflow:visible}
body[data-view=popover] .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
body[data-view=popover] #create{grid-template-columns:minmax(0,1fr) 76px;gap:8px}
body[data-view=popover] #create>:is(#types,label:has(#prompt),#estimate,#generate){grid-column:1/-1}
body[data-view=popover] #create .fields{grid-template-columns:1fr;align-self:end}
body[data-view=popover] textarea{min-height:46px;height:46px;resize:none}
body[data-view=popover] .list{gap:6px}
body[data-view=popover] :is(header.top,.tabs,.pager,#filters,#panel,#confirm .detail,.item .secondary,.only-app){display:none!important}
body[data-view=popover] .layout{grid-template-columns:1fr;gap:10px}
body[data-view=popover] .card{border:0;padding:0;background:transparent}
body[data-view=popover] .item{grid-template-columns:34px minmax(0,1fr) auto;padding:4px 6px;gap:8px;border-radius:10px}
body[data-view=popover] .thumb{width:34px;height:34px;border-radius:7px}
body[data-view=popover] .item .muted{display:none}
body[data-view=popover] #create .advanced{display:none}
/* Tile */
#tile{display:none}
body[data-view=tile]{background:transparent}
body[data-view=tile] main{display:none}
body[data-view=tile] #tile{display:flex;align-items:center;gap:8px;width:100vw;height:100vh;padding:0 8px;overflow:hidden;container-type:size}
#tile .face{flex:none;width:min(56px,calc(100vh - 8px));height:min(56px,calc(100vh - 8px));border-radius:8px;overflow:hidden;display:grid;place-items:center;background:var(--field)}
#tile .face img{width:100%;height:100%;object-fit:cover}#tile .face svg{width:70%;height:70%}
#tile strong,#tile small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#tile strong{font-size:12px}#tile small{font-size:11px;color:var(--muted)}
#tile .spin{margin-left:auto}
@container (max-width:90px){#tile .text,#tile .spin{display:none}}
@container (max-height:40px){#tile small{display:none}}
@container (min-height:100px){#tile strong{font-size:14px}#tile small{font-size:12px;white-space:normal}}
</style></head><body data-view="app">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="sf-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f6b4a"/><stop offset="1" stop-color="#7fd6a6"/></linearGradient>
<symbol id="i-logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="url(#sf-g)"/><path d="M21.5 10.6c-1.3-1.3-3.1-2-5.3-2-3.3 0-5.6 1.8-5.6 4.4 0 5.4 10.1 3.3 10.1 7.3 0 1.4-1.5 2.4-3.9 2.4-2 0-3.7-.7-5-2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-video" viewBox="0 0 24 24"><path d="M4 6h11v12H4zM15 10l5-3v10l-5-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m4 17 5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="15.5" cy="9" r="1.5" fill="currentColor"/></symbol>
<symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6h14M5 10h14M5 14h9M5 18h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="i-audio" viewBox="0 0 24 24"><path d="M4 10v4m4-7v10m4-13v16m4-12v8m4-5v2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="i-open" viewBox="0 0 24 24"><path d="M13 4h7v7m0-7-9 9M10 5H5v14h14v-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m4 12 16-8-6 16-2.5-6.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
</defs></svg>
<div id="tile" aria-live="polite"><div class="face" id="tile-face"><svg><use href="#i-logo"/></svg></div><div class="text grow"><strong id="tile-title">SwipeForge</strong><small id="tile-sub">Connect to start creating</small></div><span class="spin" id="tile-spin" hidden></span></div>
<main>
  <header class="top"><svg class="mark" aria-hidden="true"><use href="#i-logo"/></svg>
    <div class="grow"><h1>SwipeForge</h1><div class="muted small ellipsis" id="identity">Not connected</div></div>
    <div class="row wrap"><span class="chip" id="budget" hidden></span>
      <button id="open-studio" type="button"><span class="row"><svg class="icon"><use href="#i-open"/></svg>Open SwipeForge</span></button>
      <button id="disconnect" type="button" hidden>Disconnect</button></div>
  </header>
  <section class="card" id="connect-card" hidden>
    <div class="row"><svg class="mark" aria-hidden="true"><use href="#i-logo"/></svg><strong class="grow">Connect SwipeForge</strong></div>
    <ol class="only-app"><li>Nextbrowser opens SwipeForge in your browser.</li><li>Sign in with your Nextbrowser account and press Allow (Enter).</li><li>Come back here: your videos, images and posts appear in this app.</li></ol>
    <p class="notice" id="connect-note"></p>
    <div class="row wrap"><button class="primary" id="connect" type="button">Connect SwipeForge</button><button id="cancel-connect" type="button" hidden>Cancel</button></div>
  </section>
  <div class="layout" id="workspace" hidden>
    <form class="card" id="create" novalidate>
      <strong class="only-app">Create</strong>
      <div class="segmented" role="group" aria-label="What to create" id="types">
        <button type="button" data-type="video" aria-pressed="true">Video</button><button type="button" data-type="image" aria-pressed="false">Image</button><button type="button" data-type="text" aria-pressed="false">Text</button><button type="button" data-type="audio" aria-pressed="false" class="only-app">Audio</button>
      </div>
      <label><span class="lbl">Your idea</span><textarea id="prompt" maxlength="10000" placeholder="A paper boat drifting through a rainy neon street" rows="3" required></textarea></label>
      <label><span class="lbl">Model</span><select id="model"></select></label>
      <div class="fields">
        <label data-for="video audio"><span class="lbl">Length, seconds</span><input id="duration" type="number" min="1" max="120" step="1" value="5"></label>
        <label data-for="video" class="advanced">Resolution<select id="resolution"><option>480p</option><option selected>720p</option><option>1080p</option><option value="4k">4K</option></select></label>
        <label data-for="video image" class="advanced">Shape<select id="aspect"><option value="9:16">9:16 vertical</option><option value="16:9">16:9 wide</option><option value="1:1">1:1 square</option><option value="4:5">4:5 portrait</option></select></label>
        <label class="advanced">Made for<select id="platform"><option value="tiktok">TikTok</option><option value="instagram">Instagram</option><option value="youtube">YouTube</option><option value="x">X</option><option value="facebook">Facebook</option><option value="linkedin">LinkedIn</option></select></label>
      </div>
      <p class="notice" id="estimate" aria-live="polite"></p>
      <button class="primary" id="generate" type="submit">Generate</button>
    </form>
    <section class="card" style="display:grid;gap:10px;min-width:0">
      <div class="row wrap"><div class="tabs grow" role="tablist"><button type="button" role="tab" id="tab-creations" aria-selected="true">Creations</button><button type="button" role="tab" id="tab-posts" aria-selected="false">Posts</button></div>
        <div class="row" id="filters"><select id="status-filter" aria-label="Filter by status"><option value="">All</option><option value="pending,in_progress">In progress</option><option value="success">Ready</option><option value="failed">Failed</option><option value="draft">Drafts</option></select></div></div>
      <ul class="list" id="items" aria-live="polite"></ul>
      <div class="pager"><button type="button" id="prev">Previous</button><span class="muted small" id="page"></span><button type="button" id="next">Next</button></div>
    </section>
  </div>
  <section class="card" id="panel" hidden aria-label="Publish">
    <div class="row"><strong class="grow" id="panel-title">Publish</strong><button type="button" id="panel-close">Close</button></div>
    <div class="fields"><label>Account<select id="account"></select></label>
      <label>When<select id="when"><option value="publish">Publish now</option><option value="schedule">Schedule</option></select></label>
      <label id="at-field" hidden>Date and time<input id="at" type="datetime-local"></label>
      <label id="x-kind-field" hidden>X post type<select id="x-kind"><option value="post">Post</option><option value="video">Video</option><option value="article">Article</option></select></label>
      <label id="x-title-field" hidden>Article title<input id="x-title" maxlength="200"></label></div>
    <p class="notice" id="panel-note"></p>
    <div class="row wrap"><button class="primary" id="prepare" type="button">Send for approval</button><button type="button" id="finish-in-studio" hidden>Continue in SwipeForge</button></div>
  </section>
  <section class="card" id="confirm" hidden role="alertdialog" aria-labelledby="confirm-title">
    <strong id="confirm-title"></strong><p class="notice detail" id="confirm-detail"></p>
    <div class="row"><button class="primary" id="confirm-yes" type="button">Confirm</button><button id="confirm-no" type="button">Keep</button></div>
  </section>
  <p id="error" role="alert"></p>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const api = document.modelContext ?? navigator.modelContext;
const uuid = () => crypto.randomUUID();
const UUID = '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$';
const PLATFORMS = ['tiktok','instagram','youtube','x','facebook','linkedin'];
const TYPES = ['video','image','text','audio'];
const state = { view:'app', connection:null, models:null, modelsAt:0, tab:'creations', page:1, pages:1, items:[], accounts:null,
  thumbs:new Map(), saved:{revision:0,value:null}, publish:null, confirm:null, waitingApproval:null };

// ---------- Desktop bridge ----------
async function bridge(action, extra = {}) {
  const response = await fetch('/swipeforge', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ ...extra, action }) });
  let value = null;
  try { value = await response.json(); } catch { /* No body. */ }
  if (response.status === 403 || response.status === 410) throw Error('Open SwipeForge from the Nextbrowser desktop window to use your connection.');
  if (!response.ok) throw Error(value?.error || 'SwipeForge is unavailable right now.');
  return value;
}
async function remote(tool, args = {}) {
  const out = await bridge('call', { tool, arguments: args });
  if (out.isError) throw Error(out.error || 'SwipeForge rejected the request.');
  return out.value;
}
// REST-backed SwipeForge tools wrap their payload as {status, data}.
const rest = value => value && typeof value === 'object' && 'status' in value && 'data' in value ? value.data : value;
const clip = (text, n) => typeof text === 'string' && text.length > n ? text.slice(0, n - 1) + '…' : text ?? null;

// ---------- Validation shared by the UI and WebMCP ----------
function check(schema, input) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) throw Error('Expected an object of arguments.');
  const props = schema.properties ?? {};
  for (const key of Object.keys(input)) if (!Object.hasOwn(props, key)) throw Error(`Unknown argument "${key}".`);
  for (const key of schema.required ?? []) if (input[key] === undefined || input[key] === '') throw Error(`"${key}" is required.`);
  for (const [key, value] of Object.entries(input)) {
    const p = props[key];
    if (value === undefined) continue;
    const ok = p.type === 'integer' ? Number.isSafeInteger(value) : p.type === 'number' ? typeof value === 'number' && Number.isFinite(value)
      : p.type === 'object' ? !!value && typeof value === 'object' && !Array.isArray(value) : typeof value === p.type;
    if (!ok) throw Error(`"${key}" must be ${p.type === 'integer' ? 'an integer' : p.type === 'object' ? 'an object' : 'a ' + p.type}.`);
    if (p.enum && !p.enum.includes(value)) throw Error(`"${key}" must be one of: ${p.enum.join(', ')}.`);
    if ((p.minimum !== undefined && value < p.minimum) || (p.maximum !== undefined && value > p.maximum) ||
        (p.exclusiveMinimum !== undefined && value <= p.exclusiveMinimum)) throw Error(`"${key}" is out of range.`);
    if (typeof value === 'string' && ((p.maxLength && value.length > p.maxLength) || (p.minLength && value.trim().length < p.minLength))) throw Error(`"${key}" has an invalid length.`);
    if (p.pattern && !new RegExp(p.pattern).test(value)) throw Error(`"${key}" has an invalid format.`);
    if (p.type === 'object' && JSON.stringify(value).length > 16000) throw Error(`"${key}" is too large.`);
  }
}
const s = (description, extra = {}) => ({ type:'string', description, ...extra });
const id = description => s(description, { pattern:UUID });
const confirmArg = { type:'boolean', description:'true only after the user explicitly asked for this.' };
const requestId = s('Optional stable ID for this request. Reuse it only to retry the same call after a timeout; omit it for a new request.', { minLength:8, maxLength:80, pattern:'^[A-Za-z0-9_-]+$' });
const generation = {
  type: s('What to create.', { enum:TYPES }),
  prompt: s('The idea, scene description or script.', { minLength:1, maxLength:10000 }),
  provider_id: s('provider_id from list_models.', { minLength:1, maxLength:60 }),
  model: s('model from list_models.', { minLength:1, maxLength:160 }),
  duration_seconds: { type:'integer', minimum:1, maximum:120, description:'Length for video or audio. Each model accepts its own lengths; the estimate reports a mismatch.' },
  resolution: s('Video resolution.', { enum:['480p','720p','1080p','4k'] }),
  aspect_ratio: s('Frame shape.', { enum:['9:16','16:9','1:1','4:5'] }),
  platform: s('Platform the creation is made for. Defaults to tiktok.', { enum:PLATFORMS }),
  title: s('Optional title shown in the SwipeForge library.', { maxLength:255 }),
};
function generationBody(input) {
  const params = { providerId:input.provider_id, model:input.model, prompt:input.prompt };
  if (input.duration_seconds !== undefined && ['video','audio'].includes(input.type)) params.duration = input.duration_seconds;
  if (input.resolution && input.type === 'video') params.resolution = input.resolution;
  if (input.aspect_ratio && ['video','image'].includes(input.type)) params.aspectRatio = input.aspect_ratio;
  return { type:input.type, platformTarget:input.platform ?? 'tiktok', topic:input.prompt.slice(0, 500), prompt:input.prompt,
    ...(input.title ? { title:input.title } : {}), generationParams:params };
}
function summary(item) {
  const params = item?.generationParams ?? {};
  return { id:item.id, type:item.type, status:item.status, title:clip(item.title || params.prompt || item.textContent || '', 90),
    model:params.model ? `${params.providerId ?? ''}/${params.model}` : null, created_at:item.createdAt };
}
function postSummary(post) {
  return { id:post.id, status:post.status, platform:post.platform ?? post.socialAccount?.platform ?? null, content_id:post.contentId ?? null,
    account_id:post.socialAccountId ?? null, scheduled_at:post.scheduledAt ?? null, published_at:post.publishedAt ?? null,
    url:post.platformPostUrl ?? post.postUrl ?? null, error:clip(post.errorMessage ?? post.lastError ?? null, 200) };
}

// ---------- Operations (the UI and every tool use these) ----------
const ops = {
  async get_connection() {
    const status = await bridge('status');
    const out = { connected:status.connected, pending:status.pending, problem:status.problem, studio_url:status.studioUrl,
      scopes:status.scopes, connected_at:status.connectedAt, expires_at:status.expiresAt };
    if (status.connected) {
      const me = rest(await remote('get_workspace'));
      out.workspace = { name:me?.tenant?.name ?? null, email:me?.email ?? null };
      // Nextbrowser connections have no allowance of their own: the account's level limits apply.
      if (me?.mcp && !me.mcp.unmetered) out.budget = { total_usd:me.mcp.budgetEstimatedUsd, remaining_usd:me.mcp.remainingEstimatedUsd, reserved_usd:me.mcp.reservedEstimatedUsd };
      try { out.generation_access = rest(await remote('get_generation_access'))?.status ?? null; } catch { out.generation_access = null; }
    }
    state.connection = out;
    return out;
  },
  async connect() {
    const status = await bridge('connect');
    return { connected:status.connected, pending:status.pending,
      message: status.connected ? 'SwipeForge is already connected.' : 'SwipeForge opened in the browser. Ask the user to sign in and press Allow there, then call get_connection.' };
  },
  async disconnect({ confirm }) {
    if (confirm !== true) throw Error('Ask the user to confirm disconnecting SwipeForge, then pass confirm=true.');
    await bridge('disconnect');
    state.connection = null; state.models = null; state.accounts = null; state.items = [];
    return { connected:false };
  },
  async list_models({ type, include_unavailable = false }) {
    if (!state.models || Date.now() - state.modelsAt > 300000) {
      const value = await remote('get_generation_models');
      state.models = (value?.models ?? []).map(m => ({ provider_id:m.providerId, model:m.model, type:m.type, available:m.available === true, priced:m.priced === true }));
      state.modelsAt = Date.now();
    }
    const models = state.models.filter(m => (!type || m.type === type) && (include_unavailable || m.available));
    return { models:models.slice(0, 60), note:'Generations count against the SwipeForge account\'s level limits.' };
  },
  async estimate_generation(input) {
    const body = generationBody(input);
    let estimate;
    try { estimate = await remote('estimate_generation', { body }); }
    catch (error) { return { price_known:false, message:error.message }; }
    const out = { price_known:typeof estimate?.estimatedUsd === 'number', estimated_usd:estimate?.estimatedUsd ?? null,
      simulation:estimate?.simulation === true, note:'List price estimate, not an invoice.' };
    if (input.type === 'video') {
      try {
        const quote = rest(await remote('get_video_estimate', { body:{ provider:input.provider_id, model:input.model, resolution:input.resolution ?? '720p',

      if (response?.ok) { state.saved.revision = (await response.json()).revision; return; }
      if (response?.status !== 409) return;
      const wanted = state.saved.value;

let estimateTimer, estimateTick = 0, lastEstimate = null;

  if (!c?.connected) {
    el('tile-title').textContent = 'SwipeForge';
    el('tile-sub').textContent = c?.pending ? 'Waiting for your approval' : 'Connect to start creating';
  } else if (active.length) {
    el('tile-title').textContent = active.length === 1 ? 'Rendering ' + active[0].type : `Rendering ${active.length} creations`;
    el('tile-sub').textContent = active[0].title || 'In progress';
  } else if (latest) {
    el('tile-title').textContent = latest.title || 'Latest creation';
    el('tile-sub').textContent = statusLabel(latest.status) + ' · ' + ago(latest.created_at);
  } else {
    el('tile-title').textContent = 'SwipeForge';
    el('tile-sub').textContent = 'No creations yet';
  }
  const face = el('tile-face');
  if (latest && !active.length) void thumbnail(latest, face);
  else face.replaceChildren(icon('#i-logo', ''));
}
let refreshing, lastRefresh = 0;
async function refresh({ quiet = false } = {}) {
  if (refreshing) return refreshing;
  lastRefresh = Date.now();
  refreshing = (async () => {
    try {
      await ops.get_connection();
      renderConnection();
      if (state.connection.connected) {
        if (!state.models && state.view !== 'tile') { await fillModels(); syncTypeFields(); }
        if (state.tab === 'posts') {
          const posts = await ops.list_posts({ page:state.page });
          state.items = posts.items; state.pages = posts.total_pages;
        } else {
          const filter = el('status-filter').value;
          const list = await ops.list_creations({ page:state.page, limit:state.view === 'app' ? 10 : 5, ...(filter ? { status:filter } : {}) });
          state.items = list.items; state.pages = list.total_pages;
        }
      } else state.items = [];
      renderItems();
      if (!quiet) report();
    } catch (error) { renderTile(); if (!quiet || state.view !== 'tile') report(error); }
    finally { refreshing = undefined; }
  })();
  return refreshing;
}
function nextDelay() {
  if (state.connection?.pending || state.waitingApproval) return 2500;
  return state.items.some(i => running(i.status)) ? 4000 : 20000;
}
// A one-second tick re-reads the delay, so starting a sign-in or a render speeds polling up at once.
setInterval(() => { if (!document.hidden && !refreshing && Date.now() - lastRefresh >= nextDelay()) void refresh({ quiet:true }); }, 1000);

function ask(title, detail, run) {
  state.confirm = run;
  el('confirm-title').textContent = title;
  el('confirm-detail').textContent = detail;
  el('confirm').hidden = false;
  el('confirm-yes').focus();
}
el('confirm-no').onclick = () => { el('confirm').hidden = true; state.confirm = null; };
el('confirm-yes').onclick = () => act(async () => { const run = state.confirm; el('confirm').hidden = true; state.confirm = null; if (run) await run(); await refresh(); });

async function openPublish(item) {
  state.publish = item;
  el('panel').hidden = false;
  el('panel-title').textContent = 'Publish: ' + (item.title || 'creation');
  el('panel-note').textContent = '';
  el('x-kind').value = item.type === 'video' ? 'video' : 'post';
  const { accounts } = await act(() => ops.list_accounts()) ?? { accounts:[] };
  el('account').replaceChildren(...accounts.map(a => node('option', { value:a.id, text:`${a.name || a.platform} · ${a.platform}` })));
  if (!accounts.length) el('panel-note').textContent = 'Connect a social account in SwipeForge first.';
  syncPublishFields();
  el('panel').scrollIntoView({ block:'nearest' });
}
function syncPublishFields() {
  const account = state.accounts?.find(a => a.id === el('account').value);
  const platform = account?.platform;
  const studioOnly = platform === 'tiktok' || platform === 'youtube';
  el('at-field').hidden = el('when').value !== 'schedule';
  el('x-kind-field').hidden = platform !== 'x';
  el('x-title-field').hidden = platform !== 'x' || el('x-kind').value !== 'article';
  el('finish-in-studio').hidden = !studioOnly;
  el('prepare').hidden = studioOnly || !account;
  if (studioOnly) el('panel-note').textContent = (platform === 'tiktok' ? 'TikTok' : 'YouTube') + ' asks for its own privacy and audience options. Finish this post in SwipeForge.';
  else if (!state.waitingApproval) el('panel-note').textContent = account ? 'SwipeForge shows the exact post for your approval before anything is published.' : el('panel-note').textContent;
}
el('account').onchange = el('when').onchange = el('x-kind').onchange = syncPublishFields;
el('panel-close').onclick = () => { el('panel').hidden = true; state.publish = null; state.waitingApproval = null; };
el('finish-in-studio').onclick = () => act(() => ops.open_in_swipeforge({ page:'creation', id:state.publish.id }));
el('prepare').onclick = () => act(async () => {
  const account = state.accounts?.find(a => a.id === el('account').value);
  const settingsFor = account?.platform === 'x' ? { kind:el('x-kind').value, ...(el('x-kind').value === 'article' ? { title:el('x-title').value.trim() } : {}) } : {};
  const mode = el('when').value;
  const input = { content_id:state.publish.id, account_id:account.id, mode, platform_settings:settingsFor, request_id:uuid().replace(/-/g, '') };
  if (mode === 'schedule') input.scheduled_at = el('at').value ? new Date(el('at').value).toISOString() : '';
  check(schemas.prepare_post, input);
  const prepared = await ops.prepare_post(input);
  state.waitingApproval = { action:prepared.action_id, request:input.request_id };
  el('panel-note').textContent = 'Review and approve the post on the SwipeForge page in your browser. Nextbrowser publishes it as soon as you approve.';
  el('prepare').disabled = true;
  void watchApproval();
});
async function watchApproval() {
  while (state.waitingApproval) {
    const waiting = state.waitingApproval;
    const approval = await ops.get_post_approval({ action_id:waiting.action }).catch(() => null);
    if (state.waitingApproval !== waiting) return;
    if (approval?.status === 'approved') {
      const post = await act(() => ops.publish_approved({ action_id:waiting.action, request_id:waiting.request }));
      state.waitingApproval = null;
      el('prepare').disabled = false;
      if (post) { el('panel-note').textContent = post.scheduled_at ? 'Scheduled. Follow it under Posts.' : 'Sent to the platform. Follow delivery under Posts.'; }
      return;
    }
    if (approval?.status === 'expired_or_declined' || approval?.status === 'published') {
      state.waitingApproval = null;
      el('prepare').disabled = false;
      el('panel-note').textContent = approval.status === 'published' ? 'Already published.' : 'The approval expired or was declined. Send it again if you still want to post.';
      return;
    }
    await new Promise(resolve => setTimeout(resolve, 2500));
  }
}

el('connect').onclick = () => act(async () => { await ops.connect(); await refresh(); });
el('cancel-connect').onclick = () => act(async () => { await bridge('cancel'); await refresh(); });
el('disconnect').onclick = () => ask('Disconnect SwipeForge?', 'Nextbrowser loses access to your SwipeForge workspace. Your creations stay in SwipeForge.', () => ops.disconnect({ confirm:true }));
el('open-studio').onclick = () => act(() => ops.open_in_swipeforge({ page:'home' }));
for (const button of el('types').querySelectorAll('button')) button.onclick = () => act(async () => {
  saveSettings({ type:button.dataset.type, provider_id:'', model:'' });
  syncTypeFields();
  await fillModels();
  scheduleEstimate();
});
el('model').onchange = () => { const [provider_id, model] = el('model').value.split('|'); saveSettings({ provider_id, model }); scheduleEstimate(); };
for (const [field, key, read] of [['duration','duration_seconds',v => Number(v)],['resolution','resolution',v => v],['aspect','aspect_ratio',v => v],['platform','platform',v => v]]) {
  el(field).onchange = () => { saveSettings({ [key]:read(el(field).value) }); scheduleEstimate(); };
}
el('prompt').oninput = scheduleEstimate;
el('create').onsubmit = event => {
  event.preventDefault();
  return act(async () => {
    const input = formInput();
    if (!input.prompt) throw Error('Describe what to create.');
    if (!input.model) throw Error('Choose a model.');
    check(schemas.estimate_generation, input);
    const estimate = lastEstimate?.input === JSON.stringify(input) ? lastEstimate.value : await ops.estimate_generation(input);
    // After the user approved an unknown price in the browser, the same inputs carry that approval.
    const approved = state.pendingCostApproval?.input === JSON.stringify(input) ? state.pendingCostApproval.action : undefined;
    el('generate').disabled = true;
    try {
      const started = await ops.generate({ ...input, ...(state.connection?.budget ? { max_estimated_usd:budgetFor(estimate) } : {}), ...(approved ? { action_id:approved } : {}) });
      state.pendingCostApproval = null;
      el('estimate').textContent = started.executed ? 'Started. It appears below and keeps rendering in SwipeForge if you close this window.' : 'Approve the cost on the SwipeForge page in your browser, then press Generate again.';
      if (started.executed) { el('prompt').value = ''; state.tab = 'creations'; state.page = 1; }
      if (!started.executed && started.action_id) state.pendingCostApproval = { input:JSON.stringify(input), action:started.action_id };
    } finally { el('generate').disabled = false; }
    await refresh();
  });
};
el('tab-creations').onclick = () => { state.tab = 'creations'; state.page = 1; syncTabs(); void refresh(); };
el('tab-posts').onclick = () => { state.tab = 'posts'; state.page = 1; syncTabs(); void refresh(); };
function syncTabs() {
  el('tab-creations').setAttribute('aria-selected', String(state.tab === 'creations'));
  el('tab-posts').setAttribute('aria-selected', String(state.tab === 'posts'));
  el('filters').hidden = state.tab !== 'creations';
}
el('status-filter').onchange = () => { state.page = 1; void refresh(); };
el('prev').onclick = () => { state.page = Math.max(1, state.page - 1); void refresh(); };
el('next').onclick = () => { state.page += 1; void refresh(); };

fetch('/context').then(r => r.json()).catch(() => ({})).then(async context => {
  state.view = context.view === 'popover' ? 'popover' : context.blockId ? 'tile' : 'app';
  document.body.dataset.view = state.view;
  if (state.view === 'popover') {
    const panel = document.querySelector('main');
    new ResizeObserver(() => {
      const height = Math.ceil(panel.getBoundingClientRect().height);
      if (height) void fetch('/context', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ height }) }).catch(() => {});
    }).observe(panel);
  }
  await loadSaved();
  const current = settings();
  el('duration').value = current.duration_seconds;
  el('resolution').value = current.resolution;
  el('aspect').value = current.aspect_ratio;
  el('platform').value = current.platform;
  syncTypeFields();
  await refresh();
});
</script></body></html>
