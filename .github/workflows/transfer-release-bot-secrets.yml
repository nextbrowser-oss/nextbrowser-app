name: Transfer Release Bot Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source secrets
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          TARGET_TOKEN: ${{ secrets.RELEASE_BOT_SECRET_TRANSFER_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_BOT_TOKEN}" || -z "${SLACK_CHANNEL_ID}" || -z "${TARGET_TOKEN}" ]]; then
            echo "Source Slack secrets and transfer token are required" >&2
            exit 1
          fi

      - name: Transfer Slack secrets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_SECRET_TRANSFER_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          printf '%s' "${SLACK_BOT_TOKEN}" | gh secret set SLACK_BOT_TOKEN --repo nextbrowser-oss/nextbrowser-infra
          printf '%s' "${SLACK_CHANNEL_ID}" | gh secret set SLACK_CHANNEL_ID --repo nextbrowser-oss/nextbrowser-infra
