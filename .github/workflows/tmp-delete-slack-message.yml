name: Temporary Slack message cleanup

on:
  workflow_dispatch:
    inputs:
      issue_url:
        description: Newline-separated GitHub issue URLs whose root Slack messages should be deleted
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-message:
    runs-on: ubuntu-latest
    steps:
      - name: Delete matching Slack root message
        uses: actions/github-script@v8
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          ISSUE_URLS: ${{ inputs.issue_url }}
        with:
          script: |
            async function slackApi(method, body) {
              const response = await fetch(`https://slack.com/api/${method}`, {
                method: "POST",
                headers: {
                  authorization: `Bearer ${process.env.SLACK_BOT_TOKEN}`,
                  "content-type": "application/json; charset=utf-8",
                },
                body: JSON.stringify(body),
              });
              const result = await response.json();
              if (!response.ok || !result.ok) {
                throw new Error(`Slack ${method} failed: ${response.status} ${JSON.stringify(result)}`);
              }
              return result;
            }

            const issueUrls = process.env.ISSUE_URLS.split(/\s+/).filter(Boolean);
            let cursor;
            const roots = new Map();
            do {
              const history = await slackApi("conversations.history", {
                channel: process.env.SLACK_CHANNEL_ID,
                limit: 200,
                ...(cursor ? { cursor } : {}),
              });
              for (const message of history.messages ?? []) {
                const issueUrl = issueUrls.find((url) => message.text?.includes(url));
                if (issueUrl) roots.set(issueUrl, message.thread_ts ?? message.ts);
              }
              cursor = history.response_metadata?.next_cursor || undefined;
            } while (cursor && roots.size < issueUrls.length);

            for (const issueUrl of issueUrls) {
              const ts = roots.get(issueUrl);
              if (!ts) {
                core.warning(`Could not find a Slack message containing ${issueUrl}`);
                continue;
              }
              await slackApi("chat.delete", {
                channel: process.env.SLACK_CHANNEL_ID,
                ts,
              });
              core.info(`Deleted Slack root message for ${issueUrl}`);
            }
