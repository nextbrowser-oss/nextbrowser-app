name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/package-macos.yml
    with:
      corporate_signing: true
      version_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      artifact_name: NextBrowser-macOS-${{ github.sha }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Signing and updater metadata regressions
        run: node --test scripts/macos-signing.node.mjs
      - name: Sync version from tag
        if: github.ref_type == 'tag'
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: node scripts/sync-version.mjs "$env:VERSION_TAG"
      - name: Critical feature regressions (mandatory)
        run: npm run test:critical
      - run: npm test
      - run: npm run dist:win
      - name: Launch packaged app
        run: node scripts/smoke-launch.mjs release/win-unpacked/NextBrowser.exe
      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: NextBrowser-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Prepare release metadata
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          node scripts/sync-version.mjs "$VERSION_TAG"
          node scripts/generate-release-notes.mjs "$VERSION_TAG" release-notes.md
      - uses: actions/download-artifact@v5
        with:
          name: NextBrowser-macOS-${{ github.sha }}
          path: release-artifacts
      - uses: actions/download-artifact@v5
        with:
          name: NextBrowser-Windows-${{ github.sha }}
          path: release-artifacts
      - name: Require verified corporate macOS artifacts
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const evidence=JSON.parse(fs.readFileSync('release-artifacts/macos-signing-evidence.json'));
          const pkg=JSON.parse(fs.readFileSync('package.json'));
          assert.equal(evidence.status,'passed');
          assert.equal(evidence.commit,process.env.GITHUB_SHA);
          assert.equal(evidence.version,pkg.version);
          assert.equal(evidence.team,'98Y48GDG5M');
          assert.equal(evidence.identity,'Developer ID Application: MULTILOGIN OÜ (98Y48GDG5M)');
          assert.equal(evidence.dmg_and_zip_verified,true);
          assert.equal(evidence.private_key_exported,false);
          NODE
          cd release-artifacts
          sha256sum --check macos-SHA256SUMS
      - name: Publish coordinated Windows and macOS release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
            release-artifacts/*.exe
            release-artifacts/*.blockmap
            release-artifacts/latest*.yml
            release-artifacts/macos-signing-evidence.json
            release-artifacts/macos-SHA256SUMS
          body_path: release-notes.md
          fail_on_unmatched_files: true
