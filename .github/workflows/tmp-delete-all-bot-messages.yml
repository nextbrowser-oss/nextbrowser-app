name: Temporary delete bot messages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        with:
          script: |
            async function slackApi(method, body = {}) {
              const isForm = method === "conversations.replies";
              const response = await fetch(`https://slack.com/api/${method}`, {
                method: "POST",
                headers: {
                  authorization: `Bearer ${process.env.SLACK_BOT_TOKEN}`,
                  "content-type": isForm
                    ? "application/x-www-form-urlencoded; charset=utf-8"
                    : "application/json; charset=utf-8",
                },
                body: isForm ? new URLSearchParams(body) : JSON.stringify(body),
              });
              const result = await response.json();
              if (!result.ok) throw new Error(`Slack ${method} failed: ${JSON.stringify(result)}`);
              return result;
            }

            const identity = await slackApi("auth.test");
            const ownMessages = new Map();
            let cursor;

            do {
              const history = await slackApi("conversations.history", {
                channel: process.env.SLACK_CHANNEL_ID,
                limit: 200,
                ...(cursor ? { cursor } : {}),
              });

              for (const message of history.messages ?? []) {
                const isOwn = message.user === identity.user_id;
                if (isOwn) ownMessages.set(message.ts, message);

                if (message.reply_count && message.ts) {
                  const replies = await slackApi("conversations.replies", {
                    channel: process.env.SLACK_CHANNEL_ID,
                    ts: message.ts,
                    limit: 100,
                  });
                  for (const reply of replies.messages ?? []) {
                    if (reply.user === identity.user_id) {
                      ownMessages.set(reply.ts, reply);
                    }
                  }
                }
              }
              cursor = history.response_metadata?.next_cursor || undefined;
            } while (cursor);

            let deleted = 0;
            let skipped = 0;
            for (const [ts] of ownMessages) {
              try {
                await slackApi("chat.delete", {
                  channel: process.env.SLACK_CHANNEL_ID,
                  ts,
                });
                deleted += 1;
              } catch (error) {
                skipped += 1;
                core.warning(`Could not delete message ${ts}: ${error.message}`);
              }
            }

            core.info(`Deleted ${deleted} bot messages; skipped ${skipped}.`);
