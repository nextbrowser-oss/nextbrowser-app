name: Build installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: both
        type: choice
        options:
          - both
          - windows
          - macos

      corporate_signing:
        description: Sign/notarize macOS on the configured corporate Mac (CLAW-566)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    if: inputs.platform == 'both' || inputs.platform == 'macos'
    uses: ./.github/workflows/package-macos.yml
    with:
      corporate_signing: ${{ inputs.corporate_signing }}
      artifact_name: NextBrowser-macOS-${{ github.sha }}

  windows:
    name: Build Windows installer
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Signing and updater metadata regressions
        run: node --test scripts/macos-signing.node.mjs
      - name: Critical feature regressions (mandatory)
        run: npm run test:critical
      - run: npm test
      - name: Build Windows installer
        run: npm run dist:win
      - name: Verify production Settings blur
        run: node node_modules/electron/cli.js scripts/test-settings-blur.cjs
      - name: Launch packaged app
        run: node scripts/smoke-launch.mjs release/win-unpacked/NextBrowser.exe
      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: NextBrowser-Windows-${{ github.sha }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
