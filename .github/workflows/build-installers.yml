name: Verify built Windows installer
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        type: string
        default: '42040285553'
      candidate_source:
        type: string
        default: f94e9c23b383e66161800a2941e539417b767c4b
      install_scope:
        type: choice
        options: [allusers, currentuser]
        default: allusers
permissions:
  contents: read
  actions: read
jobs:
  install-launch-uninstall:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: pipeline
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: source
          ref: ${{ inputs.candidate_source }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify exact installer on a disposable Windows runner
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
          CANDIDATE_INSTALL_SCOPE: ${{ inputs.install_scope }}
        shell: pwsh
        run: ./pipeline/scripts/verify-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-windows-candidate-${{ inputs.candidate_source }}
          path: evidence/
          retention-days: 14
