name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate repository skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/validate-skills.mjs

  test:
    name: Test and package (${{ matrix.os }})
    needs: validate-skills
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Critical feature regressions (mandatory)
        run: npm run test:critical
      - run: npm test
      - name: Multilogin sign-in window regression
        run: node node_modules/electron/cli.js scripts/test-multilogin-window.cjs
      - run: npm run build
      - name: Verify production Settings blur in Electron
        run: node node_modules/electron/cli.js scripts/test-settings-blur.cjs
      - name: Preserve failed Settings blur screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: settings-blur-${{ matrix.os }}
          path: e2e-out/settings-blur-native/*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Package application without installer
        run: npm run pack
      - name: Launch packaged app (macOS)
        if: runner.os == 'macOS'
        run: node scripts/smoke-launch.mjs "release-dev/mac-arm64/NextBrowser DEV.app"
      - name: Launch packaged app (Windows)
        if: runner.os == 'Windows'
        run: node scripts/smoke-launch.mjs "release-dev/win-unpacked/NextBrowser DEV.exe"
