name: Temporary Slack bot deletion test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        with:
          script: |
            async function slackApi(method, body) {
              const response = await fetch(`https://slack.com/api/${method}`, {
                method: "POST",
                headers: {
                  authorization: `Bearer ${process.env.SLACK_BOT_TOKEN}`,
                  "content-type": "application/json; charset=utf-8",
                },
                body: JSON.stringify(body),
              });
              const result = await response.json();
              if (!result.ok) throw new Error(`Slack ${method} failed: ${JSON.stringify(result)}`);
              return result;
            }

            const message = await slackApi("chat.postMessage", {
              channel: process.env.SLACK_CHANNEL_ID,
              text: "Temporary bot deletion test",
            });
            await slackApi("chat.delete", {
              channel: process.env.SLACK_CHANNEL_ID,
              ts: message.ts,
            });
            core.info("Bot posted and deleted its own message successfully.");
